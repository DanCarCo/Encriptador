<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge Alura y Oracle Next Education - Encriptador y desencriptador de texto</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Seymour+One&display=swap" rel="stylesheet">
    <script src="code.js" defer></script>
</head>
<body>
    <header>
        <div class="logo">
            <img src="Images/Vector.png" alt="Logo Alura">
            <h1 class="titulo">Encriptador de texto</h1>
        </div>
    </header>

    <main>
        <section class="ingreso-texto">
            <textarea id="mensaje" placeholder="Ingrese la frase que desea encriptar o desencriptar"></textarea>
            <p class="parrafo">
                <img src="Images/Vector (2).png" alt="Instrucción">
                Solo letras minúsculas, sin acentos y sin caracteres especiales
            </p>
            <div class="botones">
                <button id="encriptar" aria-label="Encriptar texto">Encriptar</button>
                <button id="desencriptar" aria-label="Desencriptar texto">Desencriptar</button>
            </div>
        </section>
        
        <section class="resultado-texto">
            <textarea id="resultado" placeholder="Resultado" readonly></textarea>
            <button id="copiar" aria-label="Copiar resultado">Copiar</button>
        </section>
    </main>
    <footer>
        <p class="copyright">&copy; <span id="year"></span> Challenge 1 Alura y Oracle Next Education - DanCarCo</p>
        <div class="social-links">
            <a href="https://github.com/dancarco" target="_blank">
                <img src="Images/github-icon.png" alt="Perfil en GitHub" class="social-icon">
            </a>
            <a href="https://www.linkedin.com/in/daniel-carvajal-correa/" target="_blank">
                <img src="Images/linkedin-icon.png" alt="Perfil en LinkedIn" class="social-icon">
            </a>
        </div>
    </footer>
</body>
